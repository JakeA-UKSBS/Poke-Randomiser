<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Starter Draft Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: stadium scoreboard — a score bar across the top, one central stage below that swaps between draft, builder and battle */
:root {
  --bg: #0f1729;
  --panel: #182340;
  --panel-2: #1f2d52;
  --line: #2d3d68;
  --fg: #eef1f8;
  --muted: #93a0c2;
  --accent: #ff6247;
  --accent-ink: #1a0b07;
  --gold: #ffcd3c;
  --good: #3ccf7a;
  --warn: #f5b93a;
  --bad: #ef4b4b;
  --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 6vw, 46px); line-height: 1.05; }
h2 { font-size: clamp(20px, 4vw, 28px); }
h3 { font-size: 16px; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px; font-weight: 700; letter-spacing: .01em; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* Scoreboard */
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; background: var(--panel); border-bottom: 3px solid var(--accent); padding: 10px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.score .side { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .side.r { text-align: right; }
.score .mid { font-family: var(--font-display); font-size: 22px; text-align: center; }
.score .mid small { display: block; font-family: var(--font-data); font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.score .brand { font-family: var(--font-display); font-size: 16px; color: var(--accent); }

/* Setup */
.hero { display: grid; gap: 18px; padding-block: 28px 8px; }
.hero h1 span { color: var(--accent); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.step { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.step b { font-family: var(--font-data); color: var(--gold); display: block; font-size: 12px; margin-bottom: 4px; }
/* Hero: text on the left, three Pokémon to the side; stacks on narrow screens */
.hero { grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 28px; }
.hero-text { display: grid; gap: 18px; min-width: 0; }
.showcase { display: grid; grid-template-columns: repeat(3, 112px); gap: 4px; align-items: end; }
.show:nth-child(2) { margin-bottom: 34px; }
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .showcase { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 360px; }
  .show:nth-child(2) { margin-bottom: 18px; }
}
.show { display: grid; place-items: center; position: relative; padding-bottom: 8px; animation: bob 2.2s ease-in-out infinite alternate; }
.show::after { content: ''; position: absolute; bottom: 0; width: 64%; height: 12px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.5), transparent 70%); }
.show .sprite { width: 112px; height: 112px; max-width: 100%; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
.howto summary { cursor: pointer; display: inline-block; list-style: none; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; font-weight: 600; }
.howto summary::-webkit-details-marker { display: none; }
.howto summary::after { content: ' ▾'; color: var(--muted); }
.howto[open] summary::after { content: ' ▴'; }
.howto summary:hover { border-color: var(--muted); }
.howto summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.howto[open] summary { margin-bottom: 10px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 9px 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }

/* Pick cards */
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; text-align: left; color: var(--fg); min-width: 0; }
button.card:hover { border-color: var(--accent); transform: translateY(-2px); }
button.card { transition: transform .12s, border-color .12s; }
.card .top { display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: center; }
.sprite { width: 84px; height: 84px; image-rendering: pixelated; object-fit: contain; }
.sprite.ph { display: grid; place-items: center; background: var(--panel-2); border-radius: 50%; font-family: var(--font-display); color: var(--muted); }
.name { font-weight: 700; font-size: 17px; line-height: 1.2; }
.types { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.type { font-family: var(--font-data); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 3px; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.stats { display: grid; grid-template-columns: 34px 30px 1fr; gap: 2px 6px; font-family: var(--font-data); font-size: 11px; align-items: center; font-variant-numeric: tabular-nums; }
.stats .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.stats .bar i { display: block; height: 100%; background: var(--muted); }
.stats .bar i.hi { background: var(--good); }
.stats .bar i.mid { background: var(--warn); }
.stats .bar i.lo { background: var(--bad); }
.stats .bar { height: 8px; }
/* Pick cards */
.picks { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }
.pickcard { padding: 0; gap: 0; overflow: hidden; }
.pickcard.open { border-color: var(--gold); }
.pick-main { background: transparent; border: 0; color: var(--fg); display: grid; justify-items: center; gap: 8px; padding: 18px 14px 14px; text-align: center; width: 100%; }
.pick-main:hover { background: var(--panel-2); }
.pick-main .sprite { width: 160px; height: 160px; max-width: 100%; }
.pick-main .name { font-size: 22px; }
.pick-main .types { justify-content: center; }
.pick-main .type { font-size: 12px; padding: 3px 8px; }
.pick-hint { font-size: 12px; color: var(--muted); }
.pick-more { display: grid; gap: 12px; padding: 0 16px 16px; }
.pick-more .stats { grid-template-columns: 36px 32px 1fr; font-size: 12.5px; gap: 5px 8px; }
.abil { font-size: 13px; }
.abil b { color: var(--gold); font-weight: 600; }
.tag { font-family: var(--font-data); font-size: 11px; color: var(--gold); border: 1px solid var(--gold); padding: 1px 6px; border-radius: 3px; }

/* Ability roll */
.roll { text-align: center; padding-block: 30px; display: grid; gap: 16px; justify-items: center; }
.slot { font-family: var(--font-display); font-size: clamp(26px, 7vw, 48px); color: var(--gold); min-height: 1.3em; }
.slot.spin { color: var(--muted); }
.ab-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; width: 100%; }
.card.ab { justify-items: center; text-align: center; align-content: start; min-height: 150px; }
.card.ab .slot { font-size: clamp(20px, 4vw, 26px); }
.card.ab:disabled { cursor: default; transform: none; }
.card.ab:not(:disabled):hover, .card.ab[aria-pressed="true"] { border-color: var(--gold); }
.card.ab[aria-pressed="true"] { background: var(--panel-2); }
.form-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; width: 100%; }
button.mini { border: 1px solid transparent; color: var(--fg); }
button.mini:hover { border-color: var(--muted); }
button.mini[aria-pressed="true"] { border-color: var(--gold); }
.roll .strip { width: 100%; text-align: left; }

/* Builder */
.build { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.build .card .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.build .card .fields .full { grid-column: 1 / -1; }
.mv { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
.mv .meta { font-family: var(--font-data); font-size: 10.5px; color: var(--muted); white-space: nowrap; display: flex; gap: 5px; align-items: center; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; width: 100%; min-width: 0; font-size: 13.5px; }
.warn { color: var(--warn); font-size: 13px; }

/* Bring select */
.bring { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.bring .card { position: relative; justify-items: center; text-align: center; padding: 10px; }
.bring .card[aria-pressed="true"] { border-color: var(--gold); background: var(--panel-2); }
.bring .ord { position: absolute; top: 6px; left: 8px; font-family: var(--font-display); color: var(--gold); }
.bring .ord.ban { color: var(--bad); }
.bring .card.banned { opacity: .45; cursor: not-allowed; }
.bring .card.banned .sprite { filter: grayscale(1); }

/* Battle */
.battle { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .battle { grid-template-columns: 1fr; } }
.stage { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.fieldbar { display: flex; gap: 6px; flex-wrap: wrap; min-height: 22px; align-items: flex-start; }
.chip { font-family: var(--font-data); font-size: 11px; padding: 2px 7px; border-radius: 3px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.mon { display: grid; grid-template-columns: 1fr 130px; gap: 10px; align-items: center; }
.mon.me { grid-template-columns: 130px 1fr; }
.mon.me .sprite { transform: scaleX(-1); }
.mon .sprite { width: 120px; height: 120px; }
.hud { background: color-mix(in srgb, var(--bg) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 5px; min-width: 0; backdrop-filter: blur(2px); }
.hud.empty { visibility: hidden; }

/* Arena: a floodlit night stadium drawn in CSS; content sits above the layers */
.arena { position: relative; overflow: hidden; min-height: 340px; isolation: isolate;
  background:
    radial-gradient(ellipse 28% 22% at 12% 0%, rgba(255,244,210,.28), transparent 70%),
    radial-gradient(ellipse 28% 22% at 88% 0%, rgba(255,244,210,.28), transparent 70%),
    radial-gradient(circle, rgba(255,255,255,.22) 1px, transparent 1.6px) 0 18% / 9px 7px repeat-x,
    repeating-linear-gradient(90deg, #1c2b54 0 16px, #18264b 16px 32px) 0 0 / 100% 36% no-repeat,
    linear-gradient(180deg, #0b1330 0%, #14224a 36%, #2e7a3e 36%, #2b7139 100%); }
.arena::before { content: ''; position: absolute; inset: 36% 0 0 0; z-index: -1;
  background:
    radial-gradient(ellipse 22% 18% at 50% 52%, transparent 96%, rgba(255,255,255,.5) 97% 99%, transparent 100%),
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.45) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 48px, transparent 48px 96px); }
.arena::after { content: ''; position: absolute; left: 0; right: 0; top: 36%; height: 3px; background: rgba(255,255,255,.35); z-index: -1; }
.arena > * { position: relative; }
.arena .fieldbar .chip { background: rgba(10,15,30,.75); }
.plat { position: relative; display: grid; place-items: center; }
.plat::before { content: ''; position: absolute; bottom: 2px; left: 50%; width: 118px; height: 26px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,.45), rgba(0,0,0,.15) 60%, transparent 72%); box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
.ticker { background: rgba(8,12,26,.88); border: 1px solid rgba(255,255,255,.15); border-radius: 6px; color: #f3f5fb; padding: 7px 10px; min-height: 2.4em; font-size: 14px; }
.mute { margin-left: auto; background: rgba(10,15,30,.75); color: #dfe5f5; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 2px 8px; font-size: 11.5px; font-family: var(--font-data); }
.mute[aria-pressed="true"] { color: #8a93ad; }

/* Weather overlays */
.wx { position: absolute !important; inset: 0; z-index: 0; pointer-events: none; }
.arena[data-weather="sun"] .wx { background: radial-gradient(ellipse at 80% 0%, rgba(255,196,80,.35), transparent 60%); }
.arena[data-weather="rain"] .wx { background: repeating-linear-gradient(105deg, rgba(160,200,255,.18) 0 1px, transparent 1px 12px); animation: rain .5s linear infinite; background-color: rgba(40,70,130,.18); }
.arena[data-weather="sand"] .wx { background: rgba(200,160,90,.28); }
.arena[data-weather="snow"] .wx { background: radial-gradient(circle, rgba(255,255,255,.7) 1.2px, transparent 2px) 0 0 / 22px 22px; animation: snowfall 3s linear infinite; background-color: rgba(200,220,255,.12); }
@keyframes rain { to { background-position: -20px 40px; } }
@keyframes snowfall { to { background-position: 10px 66px; } }

/* Battle animations (on the sprite wrapper; the player's own sprite image is mirrored) */
.spr { position: relative; display: grid; place-items: center; min-height: 120px; }
.mon.foe .spr { --lx: -26px; --ly: 18px; }
.mon.me .spr { --lx: 26px; --ly: -18px; }
.spr.lunge { animation: lunge .38s ease-out; }
@keyframes lunge { 45% { transform: translate(var(--lx), var(--ly)) scale(1.07); } }
.spr.hit { animation: shake .42s; }
.spr.hit .sprite, .spr.hurt .sprite { animation: blink .42s steps(2, jump-none) 2; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes blink { 50% { opacity: .2; } }
.spr.faint, .spr.gone { animation: faint .65s ease-in forwards; }
.spr.gone { animation-duration: 0s; }
@keyframes faint { to { transform: translateY(46px); opacity: 0; } }
.spr.enter { animation: enter .5s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes enter { 0% { transform: scale(0); opacity: 0; filter: brightness(5); } 60% { filter: brightness(1.6); } }
.spr::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; pointer-events: none; opacity: 0; }
.spr.heal::after { background: radial-gradient(circle, rgba(90,255,150,.55), transparent 65%); animation: glow .6s; }
.spr.afflict::after { background: radial-gradient(circle, rgba(190,90,255,.5), transparent 65%); animation: glow .6s; }
.spr.up::after, .spr.down::after { border-radius: 0; font-size: 22px; font-weight: 700; display: grid; place-items: center; letter-spacing: 6px; }
.spr.up::after { content: '▲ ▲ ▲'; color: #5fb2ff; animation: rise .7s; }
.spr.down::after { content: '▼ ▼ ▼'; color: #ff6b6b; animation: sink .7s; }
.spr.mega::after { inset: -20px; background: conic-gradient(from 0deg, #ff5d5d, #ffd35d, #6dff8a, #5dc8ff, #b45dff, #ff5d5d); filter: blur(10px); animation: megaspin 1s; }
.spr.mega .sprite, .spr.tera .sprite { animation: brighten 1s; }
.spr.tera::after { inset: -16px; border-radius: 30%; background: conic-gradient(from 45deg, transparent, var(--tc, #fff), transparent 30%, var(--tc, #fff) 50%, transparent 70%, var(--tc, #fff)); animation: megaspin 1s; filter: blur(3px); }
@keyframes glow { 30% { opacity: 1; } }
@keyframes rise { 0% { opacity: 1; transform: translateY(20px); } 100% { opacity: 0; transform: translateY(-30px); } }
@keyframes sink { 0% { opacity: 1; transform: translateY(-20px); } 100% { opacity: 0; transform: translateY(30px); } }
@keyframes megaspin { 0% { opacity: 0; transform: rotate(0) scale(.6); } 40% { opacity: .9; } 100% { opacity: 0; transform: rotate(270deg) scale(1.2); } }
@keyframes brighten { 40% { filter: brightness(2.2); } }
.orb { position: absolute !important; width: 26px; height: 26px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 4;
  background: radial-gradient(circle, #fff 15%, var(--c) 50%, transparent 72%); box-shadow: 0 0 20px var(--c); }
.burst { position: absolute !important; width: 96px; height: 96px; border-radius: 50%; pointer-events: none; z-index: 4; transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255,255,255,.95) 10%, var(--c) 38%, transparent 70%); animation: burst .38s ease-out forwards; }
.aura { position: absolute !important; width: 130px; height: 130px; border-radius: 50%; pointer-events: none; z-index: 4; transform: translate(-50%, -50%);
  background: radial-gradient(circle, transparent 40%, var(--c) 55%, transparent 70%); animation: burst .5s ease-out forwards; }
@keyframes burst { from { transform: translate(-50%, -50%) scale(.2); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
.arena.critflash { animation: crit .3s; }
@keyframes crit { 30% { box-shadow: inset 0 0 0 4px #ffd35d, inset 0 0 60px rgba(255,211,93,.5); } }
.move .eff { font-style: normal; font-family: var(--font-data); font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 3px; justify-self: start; background: rgba(0,0,0,.35); }
.move .eff.se { color: #9dffb4; }
.move .eff.nve { color: #ffd0a0; }
.move .eff.none { color: #ffb0b0; }
.hud .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.hud .l1 .name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hp { height: 9px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.hp i { display: block; height: 100%; background: var(--good); transition: width .4s ease; }
.hp i.mid { background: var(--warn); }
.hp i.low { background: var(--bad); }
.hpnum { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status { font-family: var(--font-data); font-size: 10.5px; padding: 1px 5px; border-radius: 3px; background: var(--bad); color: #fff; text-transform: uppercase; }
.bench { display: flex; gap: 4px; }
.bench i { width: 10px; height: 10px; border-radius: 50%; background: var(--good); display: block; }
.bench i.f { background: var(--line); }
.controls { display: grid; gap: 10px; }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.move { border: 0; border-radius: 8px; padding: 9px 10px; text-align: left; color: #fff; display: grid; gap: 2px; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.move b { font-size: 14.5px; }
.move span { font-family: var(--font-data); font-size: 10.5px; opacity: .9; }
.move:disabled { opacity: .35; cursor: not-allowed; }
.move:not(:disabled):hover { filter: brightness(1.12); }
.switches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.sw { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; text-align: left; font-size: 13px; }
.sw img, .sw .sprite { width: 34px; height: 34px; }
.sw:hover:not(:disabled) { border-color: var(--accent); }
.sw:disabled { opacity: .35; cursor: not-allowed; }
.toggle { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.toggle[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; height: min(560px, 70vh); overflow-y: auto; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.log .t { font-family: var(--font-display); color: var(--accent); margin-top: 8px; font-size: 13px; }
.log .big { color: var(--gold); font-weight: 600; }
.log .sub { color: var(--muted); }
.curtain { min-height: 50vh; display: grid; place-content: center; text-align: center; gap: 16px; }

<script>
const {Dex, Battle, Teams, POOL, STARTERS, COMMON_ITEMS, megaStonesFor, movepool, learnset, defaultSet} = PK;
// Abilities that never appear in the rolls
const BANNED_ABILITIES = ['Wonder Guard', 'Pure Power', 'Huge Power'];
const ABILITIES = PK.ABILITIES.filter(a => !BANNED_ABILITIES.includes(a));
const $app = document.getElementById('app');
const $score = document.getElementById('scorebar');
const DRAFT_PICKS = 6, OPTIONS = 3, BRING = 6, TEAM = DRAFT_PICKS + 1;
const TYPE_COLORS = {Normal:'#9a9a78',Fire:'#e2702c',Water:'#4f7de0',Electric:'#d9b01e',Grass:'#5aa93a',Ice:'#5dbdbd',Fighting:'#b8322b',Poison:'#94409a',Ground:'#c9a44e',Flying:'#8f7fe0',Psychic:'#e8517e',Bug:'#91a31f',Rock:'#a8912f',Ghost:'#6a5594',Dragon:'#6a3cf0',Dark:'#6b5647',Steel:'#8f8fae',Fairy:'#d97fa0',Stellar:'#3c7fb0','???':'#607070'};
const TYPES = Object.keys(TYPE_COLORS).filter(t => t !== '???');
const SPREADS = {
  physfast: {label: 'Fast physical (Jolly, 252 Atk / 252 Spe)', nature: 'Jolly', evs: {hp: 4, atk: 252, spe: 252}},
  physpow: {label: 'Strong physical (Adamant, 252 Atk / 252 Spe)', nature: 'Adamant', evs: {hp: 4, atk: 252, spe: 252}},
  specfast: {label: 'Fast special (Timid, 252 SpA / 252 Spe)', nature: 'Timid', evs: {hp: 4, spa: 252, spe: 252}},
  specpow: {label: 'Strong special (Modest, 252 SpA / 252 Spe)', nature: 'Modest', evs: {hp: 4, spa: 252, spe: 252}},
  physwall: {label: 'Physical wall (Impish, 252 HP / 252 Def)', nature: 'Impish', evs: {hp: 252, def: 252, spd: 4}},
  specwall: {label: 'Special wall (Calm, 252 HP / 252 SpD)', nature: 'Calm', evs: {hp: 252, def: 4, spd: 252}},
  balanced: {label: 'Balanced (Hardy, 84 in every stat)', nature: 'Hardy', evs: {hp: 84, atk: 84, def: 84, spa: 84, spd: 84, spe: 84}},
};
const STATUS = {brn: 'was burned', par: 'was paralyzed', slp: 'fell asleep', frz: 'was frozen solid', psn: 'was poisoned', tox: 'was badly poisoned'};
const STAT = {atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed', accuracy: 'accuracy', evasion: 'evasion'};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms));
const sp = id => Dex.species.get(id);

function spriteHtml(id, cls = 'sprite') {
  const s = sp(id);
  const data = SPRITES[s.id] || SPRITES[Dex.species.get(s.baseSpecies).id];
  if (data) return `<img class="${cls}" alt="${esc(s.name)}" src="data:image/png;base64,${data}">`;
  return `<div class="${cls} ph" aria-label="${esc(s.name)}">${esc(s.name.slice(0, 2))}</div>`;
}
const typeChips = types => `<div class="types">${types.map(t => `<span class="type" style="background:${TYPE_COLORS[t] || '#666'}">${esc(t)}</span>`).join('')}</div>`;
// Bars: red below 50, yellow 50–100, green over 100
const statTier = v => v > 100 ? 'hi' : v < 50 ? 'lo' : 'mid';
function statBlock(id) {
  const b = sp(id).baseStats; const labels = {hp: 'HP', atk: 'Atk', def: 'Def', spa: 'SpA', spd: 'SpD', spe: 'Spe'};
  const bst = Object.values(b).reduce((a, c) => a + c, 0);
  return `<div class="stats">${Object.entries(b).map(([k, v]) => `<span class="muted">${labels[k]}</span><span>${v}</span><span class="bar"><i class="${statTier(v)}" style="width:${Math.min(100, v / 1.6)}%"></i></span>`).join('')}<span class="muted">BST</span><span>${bst}</span><span></span></div>`;
}
const abilDesc = a => Dex.abilities.get(a).shortDesc || Dex.abilities.get(a).desc || '';

// ---------- State ----------
let S;
function freshState(mode, names) {
  return {mode, players: names.map(n => ({name: n, roster: []})), wins: [0, 0], game: 0, gameLog: []};
}
const isCpu = i => S.mode === 'cpu' && i === 1;

function renderScore(extra = '') {
  if (!S) { $score.innerHTML = `<div class="score"><span class="brand">Starter Draft</span><span></span><span></span></div>`; return; }
  const [a, b] = S.players;

}

// ---------- Online (PeerJS) ----------
// Lockstep: both browsers run the same seeded battle; only draft results, picks and move choices cross the wire.
const NET = {conn: null, peer: null, inbox: [], waiters: [], closed: false};
const USE_BC = new URLSearchParams(location.search).get('transport') === 'bc'; // local two-tab testing
const makeCode = () => Array.from({length: 5}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
function netAttach(conn) {
  NET.conn = conn; NET.inbox = []; NET.waiters = []; NET.closed = false;
  conn.on('data', msg => {
    const w = NET.waiters.findIndex(x => x.type === msg.type);
    if (w >= 0) NET.waiters.splice(w, 1)[0].res(msg.data); else NET.inbox.push(msg);
  });
  conn.on('close', () => {
    if (NET.closed) return; NET.closed = true;
    const n = S ? S.players[1 - S.me].name : 'Your friend';
    document.getElementById('netlost').hidden = false;
    document.getElementById('netlost').textContent = `Connection to ${n} lost. Start a new room from the home screen to keep playing.`;
  });
}
const netSend = (type, data) => NET.conn && NET.conn.send({type, data});
function netWait(type) {
  const k = NET.inbox.findIndex(m => m.type === type);
  if (k >= 0) return Promise.resolve(NET.inbox.splice(k, 1)[0].data);
  return new Promise(res => NET.waiters.push({type, res}));
}
function netClose() {
  NET.closed = true;
  try { NET.conn && NET.conn.close(); } catch {}
  try { NET.peer && NET.peer.destroy(); } catch {}
  NET.conn = null; NET.peer = null;
  document.getElementById('netlost').hidden = true;
}
function waitingScreen(text) {
  $app.innerHTML = `<section class="curtain"><p class="eyebrow">Online match</p><h2>${esc(text)}</h2><p class="muted">This updates by itself.</p></section>`;
}
// BroadcastChannel stand-in with PeerJS's connection shape (used only with ?transport=bc)
function bcConn(code) {
  const bc = new BroadcastChannel('sds-' + code), fns = {data: [], close: []};
  bc.onmessage = e => fns.data.forEach(f => f(e.data));
  return {send: m => bc.postMessage(m), on: (ev, f) => fns[ev]?.push(f), close: () => bc.close(), _raw: bc};
}
function openRoom(role, code, status) {
  return new Promise((resolve, reject) => {
    if (USE_BC) {
      const c = bcConn(code);
      if (role === 'host') {
        status(code);
        const onKnock = e => { if (e.data?.type === 'knock') { c._raw.removeEventListener('message', onKnock); c.send({type: 'welcome'}); resolve(c); } };
        c._raw.addEventListener('message', onKnock);
      } else {
        const t = setInterval(() => c.send({type: 'knock'}), 250);
        const onWelcome = e => { if (e.data?.type === 'welcome') { clearInterval(t); c._raw.removeEventListener('message', onWelcome); resolve(c); } };
        c._raw.addEventListener('message', onWelcome);
      }
      return;
    }
    if (!window.Peer) return reject(new Error("Online play couldn't load. Check your connection, or open the GitHub Pages version of the game."));
    if (role === 'host') {
      const peer = new Peer('sds-' + code); NET.peer = peer;
      peer.on('open', () => status(code));
      peer.on('connection', c => c.on('open', () => resolve(c)));
      peer.on('error', e => reject(new Error(e.type === 'unavailable-id' ? 'That room code is taken. Try creating the room again.' : "Couldn't reach the matchmaking server. Try again in a moment.")));
    } else {
      const peer = new Peer(); NET.peer = peer;
      peer.on('open', () => { const c = peer.connect('sds-' + code, {reliable: true}); c.on('open', () => resolve(c)); });
      peer.on('error', e => reject(new Error(e.type === 'peer-unavailable' ? `No room found with code ${code}. Check the code with your friend.` : "Couldn't reach the matchmaking server. Try again in a moment.")));
    }
  });
}

// ---------- Setup ----------
const FORMATS = {
  standard: {label: 'Standard Bo3', short: 'STANDARD', blurb: 'Any fully evolved Pokémon with a competitive set.'},
  mega: {label: 'Mega Bo3', short: 'MEGA', blurb: 'Legendaries, Mythicals and Mega Evolutions only. Megas start already Mega Evolved, no stone needed.'},
};
const savedName = () => { try { return localStorage.getItem('starter-draft-name') || ''; } catch { return ''; } };
function setup() {
  netClose();
  S = null; renderScore();
  const roomParam = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  let mode = 'online', format = 'standard';
  $app.innerHTML = `
  <section class="hero" id="herosec">
    <div class="hero-text">
    <p class="eyebrow">Draft · Build · Best of 3</p>
    <h1>Draft ${TEAM} random Pokémon, <span>roll their abilities</span>, then battle.</h1>
    <details class="howto"><summary>How to play</summary>
    <div class="steps">
      <div class="step"><b>STEP 1</b>${TEAM} rounds of picks, ${OPTIONS} random options each, from <span id="poolcount"></span> Pokémon.</div>
      <div class="step"><b>STEP 2</b>Every Pokémon you take rolls 3 random abilities from any Pokémon. Keep one. You get one reroll per draft.</div>
      <div class="step"><b>STEP 3</b>Set moves, items (one of each per team), Tera or Mega. Bring ${BRING} of your ${TEAM} to each game. Lose a game and you ban one of the winner's Pokémon.</div>
    </div></details>
    </div>
    <div class="showcase" id="showcase" aria-hidden="true"></div>
  </section>
  <section class="stack" style="margin-top:20px">
    <div class="stack" style="gap:6px" id="modesec"><span class="eyebrow">Game mode</span>
      <div class="row"><span class="seg" role="group" aria-label="Game mode">${Object.entries(FORMATS).map(([k, f]) => `<button id="f-${k}" aria-pressed="${k === format}">${esc(f.label)}</button>`).join('')}</span></div>
      <p class="muted" id="fblurb"></p></div>
    <div class="stack" style="gap:6px" id="oppsec"><span class="eyebrow">Opponent</span>
    <div class="row"><span class="seg" role="group" aria-label="Opponent">
      <button id="m-online">Online friend</button><button id="m-friend">Friend on this device</button><button id="m-cpu">Vs CPU</button></span></div></div>
    ${roomParam ? `<p class="invite">You've been invited to room <b>${esc(roomParam)}</b>. Enter your name, then join.</p>` : ''}
    <div class="setup-grid">
      <div class="field"><label for="n1" id="n1l">Player 1</label><input id="n1" value="${esc(savedName())}" placeholder="Your name" maxlength="18"></div>
      <div class="field" id="n2f"><label for="n2">Player 2</label><input id="n2" value="Challenger" maxlength="18"></div>
    </div>
    <div class="row" id="localgo"><button class="btn" id="go">Start draft</button><span class="muted">Level 50, Gen 9 mechanics, Showdown's battle engine.</span></div>
    <div class="online stack" id="online" hidden>
      <div class="row" id="hostrow"><button class="btn" id="host">Create a room</button><span class="muted">The room creator's game mode is used.</span></div>
      <div class="row"><div class="field" style="max-width:160px"><label for="code">Room code</label><input id="code" maxlength="5" autocomplete="off" value="${esc(roomParam)}" style="text-transform:uppercase;font-family:var(--font-data);letter-spacing:.15em"></div><button class="btn ghost" id="join" style="align-self:end">Join room</button></div>
      <div id="netstatus" class="stack" style="gap:8px"></div>
    </div>
  </section>`;
  const setFormat = f => {
    format = f; setPool(f);
    for (const k of Object.keys(FORMATS)) document.getElementById('f-' + k).setAttribute('aria-pressed', k === f);
    document.getElementById('fblurb').textContent = FORMATS[f].blurb;
    document.getElementById('poolcount').textContent = Object.keys(GROUP).length;
    // A few random Pokémon from this mode's pool, each with a random form
    document.getElementById('showcase').innerHTML = shuffle(Object.keys(GROUP)).slice(0, 3)
      .map((base, k) => `<div class="show" style="animation-delay:${-k * 0.37}s">${spriteHtml(rand(GROUP[base]))}</div>`).join('');
  };
  for (const k of Object.keys(FORMATS)) document.getElementById('f-' + k).onclick = () => setFormat(k);
  setFormat('standard');
  const setMode = m => {
    mode = m;
    for (const k of ['friend', 'online', 'cpu']) document.getElementById('m-' + k).setAttribute('aria-pressed', m === k);
    document.getElementById('n2').value = m === 'cpu' ? 'CPU' : 'Challenger';
    document.getElementById('n2f').hidden = m === 'online';
    document.getElementById('n1l').textContent = m === 'online' ? 'Your name' : 'Player 1';
    document.getElementById('localgo').hidden = m === 'online';
    document.getElementById('online').hidden = m !== 'online';
  };
  for (const k of ['friend', 'online', 'cpu']) document.getElementById('m-' + k).onclick = () => setMode(k);
  setMode(mode);
  // Invited players only need their name and the Join button
  if (roomParam) {
    for (const id of ['herosec', 'modesec', 'oppsec', 'hostrow']) document.getElementById(id).hidden = true;
    document.getElementById('join').className = 'btn';
    document.getElementById('online').insertAdjacentHTML('beforeend', `<p class="muted" style="font-size:13px">Not joining a friend? <a href="${esc(location.pathname)}" style="color:var(--gold)">Start your own game</a></p>`);
  }
  document.getElementById('go').onclick = () => {
    let n1 = document.getElementById('n1').value.trim() || 'Player 1';
    let n2 = document.getElementById('n2').value.trim() || 'Player 2';
    if (n1 === n2) n2 += ' 2';
    S = freshState(mode, [n1, n2]);
    S.format = format; setPool(format);
    runDraft();
  };

  const $st = document.getElementById('netstatus');
  const busy = on => { document.getElementById('host').disabled = on; document.getElementById('join').disabled = on; };
  const fail = e => { busy(false); netClose(); $st.innerHTML = `<p class="err">${esc(e.message)}</p>`; };
  // Online players must name themselves; the name is remembered on this device
  const onlineName = () => {
    const el = document.getElementById('n1'), name = el.value.trim();
    if (!name) { $st.innerHTML = '<p class="err">Enter your name first.</p>'; el.focus(); return null; }
    try { localStorage.setItem('starter-draft-name', name); } catch {}
    return name;
  };
  if (roomParam) document.getElementById('n1').focus();
  document.getElementById('host').onclick = async () => {
    const name = onlineName(); if (!name) return;
    busy(true); $st.innerHTML = '<p class="muted">Creating room…</p>';
    const code = makeCode();
    try {
      const conn = await openRoom('host', code, c => {
        const link = location.origin + location.pathname + '?room=' + c;
        $st.innerHTML = `<p class="eyebrow">Room code</p><div class="roomcode">${c}</div>
          <p class="muted">Send your friend the code, or this link:</p><div class="row"><input id="roomlink" readonly value="${esc(link)}" style="flex:1;min-width:0"><button class="btn ghost" id="copylink">Copy link</button></div>
          <p class="muted">Waiting for your friend to join…</p>`;
        document.getElementById('copylink').onclick = async e => {
          try { await navigator.clipboard.writeText(link); e.target.textContent = 'Copied'; } catch { document.getElementById('roomlink').select(); }
        };
      });
      netAttach(conn);
      const seed = Array.from({length: 3}, () => Math.floor(Math.random() * 65536)).join(',');
      netSend('hello', {name, format, seed});
      const g = await netWait('hello');
      startOnline(0, [name, g.name === name ? g.name + ' 2' : g.name], format, seed);
    } catch (e) { fail(e); }
  };
  document.getElementById('join').onclick = async () => {
    const name = onlineName(); if (!name) return;
    const code = document.getElementById('code').value.trim().toUpperCase();
    if (code.length !== 5) { $st.innerHTML = '<p class="err">Room codes are 5 characters.</p>'; return; }
    busy(true); $st.innerHTML = '<p class="muted">Joining room…</p>';
    try {
      const conn = await openRoom('guest', code, () => {});
      netAttach(conn);
      netSend('hello', {name});
      const h = await netWait('hello');
      startOnline(1, [h.name, h.name === name ? name + ' 2' : name], h.format, h.seed);
    } catch (e) { fail(e); }
  };
}
function startOnline(me, names, format, seed) {
  S = freshState('online', names);
  S.me = me; S.format = format; S.seed = seed; S.battles = 0;
  setPool(format);
  runDraft();
}

// ---------- Generic screens ----------
function curtain(title, sub, btn = 'Ready') {
  return new Promise(res => {
    $app.innerHTML = `<section class="curtain"><p class="eyebrow">${esc(sub)}</p><h2>${esc(title)}</h2><div><button class="btn" id="ok">${esc(btn)}</button></div></section>`;
    document.getElementById('ok').onclick = res; document.getElementById('ok').focus();
  });
}
// Pick card: tap the Pokémon to open its stats, then confirm with Pick
function monCard(id, extra = '') {
  const s = sp(id);
  return `<div class="card pickcard" data-id="${s.id}">
    <button class="pick-main" aria-expanded="false">${spriteHtml(id)}<div class="name">${esc(s.name)}</div>${typeChips(s.types)}${extra}<span class="pick-hint">Tap for stats</span></button>
    <div class="pick-more" hidden>${statBlock(id)}<button class="btn pick-go">Pick ${esc(s.name)}</button></div>
  </div>`;
}
function teamStrip(pl) {
  if (!pl || !pl.roster.length) return '';
  const slots = Array.from({length: DRAFT_PICKS + 1}, (_, k) => pl.roster[k]);
  return `<div class="strip"><p class="eyebrow">Your team · ${pl.roster.length}/${DRAFT_PICKS + 1}</p><div class="strip-row">${slots.map(e => e
    ? `<div class="mini">${spriteHtml(e.id)}<span class="name">${esc(sp(e.id).name)}</span>${typeChips(sp(e.id).types)}${e.rolled ? `<span class="tag">${esc(e.ability)}</span>` : ''}</div>`
    : `<div class="mini empty"><span>?</span></div>`).join('')}</div></div>`;
}
function choose(title, sub, ids, extraFn, pl) {
  return new Promise(res => {
    $app.innerHTML = `<section class="stack"><div><p class="eyebrow">${esc(sub)}</p><h2>${esc(title)}</h2></div><div class="picks">${ids.map(id => monCard(id, extraFn ? extraFn(id) : '')).join('')}</div>${teamStrip(pl)}</section>`;
    $app.querySelectorAll('.pickcard').forEach(c => {
      const main = c.querySelector('.pick-main'), more = c.querySelector('.pick-more');
      main.onclick = () => {
        const open = more.hidden;
        more.hidden = !open; main.setAttribute('aria-expanded', open);
        c.classList.toggle('open', open);
        main.querySelector('.pick-hint').textContent = open ? 'Tap to hide stats' : 'Tap for stats';
      };
      c.querySelector('.pick-go').onclick = () => res(c.dataset.id);
    });
  });
}

// ---------- Saved teams (this browser only) ----------
const SAVE_KEY = 'starter-draft-teams';
function loadSaved() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; } catch { return []; } }
function writeSaved(list) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(list)); return true; } catch { return false; } }
function saveTeam(pl) {
  const list = loadSaved();
  const label = `${sp(pl.roster[0].id).name} team · ${new Date().toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})}`;
  list.unshift({label, owner: pl.name, roster: JSON.parse(JSON.stringify(pl.roster))});
  return writeSaved(list.slice(0, 30));
}
function showdownText(roster) { return Teams.export(roster.map(toSet)); }
async function copyText(text, btn) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
  catch { btn.textContent = 'Copy blocked, text shown below'; const ta = document.getElementById('export'); ta.hidden = false; ta.value = text; ta.select(); }
  setTimeout(() => btn.textContent = old, 1800);
}
function pickSaved(pl) {
  return new Promise(res => {
    const draw = () => {
      const list = loadSaved();
      if (!list.length) return res(null);
      $app.innerHTML = `<section class="stack"><div><p class="eyebrow">${esc(pl.name)}</p><h2>Draft or use a saved team</h2></div>
        <div class="row"><button class="btn" id="new">Draft a new team</button></div>
        <div class="saved">${list.map((t, k) => `<div class="card"><div class="row" style="justify-content:space-between"><div><div class="name">${esc(t.label)}</div><div class="muted" style="font-size:13px">Saved by ${esc(t.owner)}</div></div>

const normalAbils = id => Object.values(sp(id).abilities).map(a => `<div class="abil muted">${esc(a)}</div>`).join('');

// ---------- Draft ----------
// Forms (Arceus types, regional variants, Rotom appliances...) share one pool slot; the form is chosen after picking
const baseOf = id => sp(sp(id).baseSpecies).id;
const isLegendary = id => sp(id).tags.some(t => t === 'Sub-Legendary' || t === 'Restricted Legendary' || t === 'Mythical');
const MEGAS = Dex.species.all().filter(s => s.isMega && s.exists && s.isNonstandard !== 'CAP' && s.isNonstandard !== 'Custom').map(s => s.id);
const POOLS = {
  standard: POOL,
  mega: [...POOL.filter(isLegendary), ...MEGAS],
};
let GROUP = {};
function setPool(format) {
  GROUP = {};
  for (const id of POOLS[format]) (GROUP[baseOf(id)] ||= []).push(id);
}
setPool('standard');
const repOf = base => GROUP[base].includes(base) ? base : GROUP[base][0];
const formsOf = id => GROUP[baseOf(id)] || [id];
const formsNote = id => { const f = formsOf(id); return f.length > 1 ? `<div class="abil"><span class="tag">${f.length} FORMS</span> <span class="muted">choose after picking</span></div>` : ''; };

function starterOptions() {
  const bases = [...new Set(STARTERS.map(baseOf))];
  const pick = [];
  for (const t of ['Grass', 'Fire', 'Water']) {
    const c = shuffle(bases).find(b => !pick.includes(b) && formsOf(b).some(f => sp(f).types.includes(t)));
    if (c) pick.push(c);
  }
  return pick.map(b => { const f = formsOf(b).filter(x => STARTERS.includes(x)); return f.includes(b) ? b : f[0]; });
}
// Standard mode: each option slot is a legendary/mythical with this chance (the pool alone would give ~18%)
const LEGENDARY_RATE = 0.10;
function draftOptions(owned) {
  const ownedBases = owned.map(baseOf);
  const free = shuffle(Object.keys(GROUP).filter(b => !ownedBases.includes(b)));
  if (S?.format !== 'standard') return free.slice(0, OPTIONS).map(repOf);
  const leg = free.filter(b => GROUP[b].some(isLegendary)), non = free.filter(b => !GROUP[b].some(isLegendary));
  const out = [];
  for (let k = 0; k < OPTIONS; k++) {
    const from = (Math.random() < LEGENDARY_RATE && leg.length) || !non.length ? leg : non;
    if (from.length) out.push(from.pop());
  }
  return out.map(repOf);
}
// Megas drafted directly have no Random Battle set of their own: borrow the base form's moves, never a stone
const mpool = id => { const m = movepool(sp(id).isMega ? baseOf(id) : id); return m.length ? m : learnset(id); };
// Item clause: a new Pokémon's default item skips anything the team already holds
const FALLBACK_ITEMS = ['Leftovers', 'Life Orb', 'Heavy-Duty Boots', 'Choice Scarf', 'Assault Vest', 'Sitrus Berry', 'Choice Band', 'Choice Specs', 'Expert Belt', 'Lum Berry', 'Rocky Helmet', 'Focus Sash'];
function newEntry(id, ability, rolled, taken = []) {
  const s = sp(id), b = s.baseStats;
  let d;
  try { d = defaultSet(id); } catch { d = {moves: [], item: 'Leftovers', teraType: s.types[0]}; }
  if (s.isMega) { if (!d.moves.filter(Boolean).length) d.moves = mpool(id).slice(0, 4); if (Dex.items.get(d.item).megaStone) d.item = ''; }
  const item = [d.item, ...FALLBACK_ITEMS, ...COMMON_ITEMS].find(x => x && !taken.includes(x));
  let spread = b.atk >= b.spa ? (b.spe >= 90 ? 'physfast' : 'physpow') : (b.spe >= 90 ? 'specfast' : 'specpow');
  if (Math.max(b.atk, b.spa) < 80) spread = b.def >= b.spd ? 'physwall' : 'specwall';
  const moves = [...d.moves]; while (moves.length < 4) moves.push('');
  const tera = TYPES.includes(d.teraType) ? d.teraType : s.types[0];
  return {id, ability: ability || d.ability || s.abilities[0], rolled: !!rolled, moves, item, tera, spread, full: false};
}

// Never offer an ability already on this player's team (or in `also`, e.g. the set being rerolled)
const abilityOptions = (pl, also = []) => {
  const taken = new Set([...(pl?.roster || []).map(e => e.ability), ...also]);
  return shuffle(ABILITIES.filter(a => !taken.has(a))).slice(0, 3);
};
async function rollAbility(pl, picked) {
  let finals = abilityOptions(pl);
  const forms = formsOf(picked);
  let form = picked, ability = null;
  $app.innerHTML = `<section class="roll"><p class="eyebrow">${esc(pl.name)} · ${forms.length > 1 ? 'Form and ability' : 'Ability roll'}</p><div id="rsprite">${spriteHtml(form)}</div><h2 id="rhead">Choose an ability for ${esc(sp(form).name)}</h2>
    ${forms.length > 1 ? `<div class="form-row">${forms.map(f => `<button class="mini form" data-form="${f}" aria-pressed="${f === form}">${spriteHtml(f)}<span class="name">${esc(sp(f).name)}</span>${typeChips(sp(f).types)}</button>`).join('')}</div>` : ''}
    <div class="ab-choices">${finals.map((_, k) => `<button class="card ab" id="ab${k}" disabled><span class="slot spin">?</span><span class="muted"></span></button>`).join('')}</div>
    <div class="row" style="justify-content:center">${forms.length > 1 ? `<button class="btn" id="confirm" disabled>Pick a form and an ability</button>` : ''}<button class="btn ghost" id="reroll" hidden></button></div>
    ${teamStrip(pl)}</section>`;
  const head = document.getElementById('rhead'), spr = document.getElementById('rsprite'), confirm = document.getElementById('confirm'), reroll = document.getElementById('reroll');
  const refresh = () => {
    head.textContent = `Choose an ability for ${sp(form).name}`;
    spr.innerHTML = spriteHtml(form);
    if (confirm) { confirm.disabled = !ability; confirm.textContent = ability ? `Take ${sp(form).name} with ${ability}` : 'Pick an ability'; }
  };
  $app.querySelectorAll('[data-form]').forEach(b => b.onclick = () => {
    form = b.dataset.form;
    $app.querySelectorAll('[data-form]').forEach(x => x.setAttribute('aria-pressed', x === b));
    refresh();
  });
  const cards = finals.map((_, k) => document.getElementById('ab' + k));
  const spin = async () => {
    reroll.hidden = true;
    cards.forEach(c => { c.disabled = true; c.setAttribute('aria-pressed', 'false'); c.firstChild.classList.add('spin'); c.lastChild.textContent = ''; });
    // Spin timing: first card lands after LAND ticks, each next one GAP ticks later (~0.6s total)
    const LAND = 7, GAP = 3;
    for (let i = 0; i <= LAND + (finals.length - 1) * GAP; i++) {
      cards.forEach((c, k) => { if (i < LAND + k * GAP) c.firstChild.textContent = rand(ABILITIES); });
      cards.forEach((c, k) => { if (i === LAND + k * GAP) { c.firstChild.textContent = finals[k]; c.firstChild.classList.remove('spin'); c.lastChild.textContent = abilDesc(finals[k]); } });
      await sleep(30 + i * 2);
    }
    cards.forEach(c => c.disabled = false); cards[0].focus();

  };
  reroll.onclick = async () => {
    if (!(pl.rerolls > 0)) return;
    pl.rerolls--;
    finals = abilityOptions(pl, finals);
    ability = null; refresh();
    await spin();
  };
  await spin();
  return new Promise(res => {
    cards.forEach((c, k) => c.onclick = () => {
      ability = finals[k];
      if (!confirm) return res({id: form, ability});
      cards.forEach(x => x.setAttribute('aria-pressed', x === c));
      refresh();
    });
    if (confirm) confirm.onclick = () => res({id: form, ability});
  });
}

async function draftFor(i) {
  const pl = S.players[i];
  pl.roster = [];
  if (isCpu(i)) {
    for (let k = 0; k < TEAM; k++) {
      const id = rand(draftOptions(pl.roster.map(r => r.id)));
      pl.roster.push(newEntry(rand(formsOf(id)), rand(abilityOptions(pl)), true, pl.roster.map(e => e.item)));
    }
    return;
  }
  pl.rerolls = 1;
  if (S.mode === 'friend') await curtain(`${pl.name}, your draft`, 'Hand the device over', 'Start my draft');
  const saved = await pickSaved(pl);
  if (saved) { pl.roster = saved; await builder(i); return; }
  for (let k = 0; k < TEAM; k++) {
    const owned = pl.roster.map(r => r.id);
    const id = await choose(`Pick ${k + 1} of ${TEAM}`, `${pl.name} · ${pl.roster.length} Pokémon so far`, draftOptions(owned), formsNote, pl);
    const r = await rollAbility(pl, id);
    pl.roster.push(newEntry(r.id, r.ability, true, pl.roster.map(e => e.item)));
  }
  await builder(i);
}

async function runDraft() {
  renderScore('DRAFT');
  if (S.mode === 'online') {
    const me = S.me, them = 1 - me;
    await draftFor(me);
    netSend('team', S.players[me].roster);
    waitingScreen(`Waiting for ${S.players[them].name} to finish drafting…`);
    S.players[them].roster = await netWait('team');
    await playMatch();
    return;
  }
  await draftFor(0);
  await draftFor(1);
  await playMatch();
}

// ---------- Team builder ----------
function moveMeta(name) {

      <div class="field"><label for="te-${idx}">Tera type</label><select id="te-${idx}" data-k="tera" ${isMega ? 'disabled' : ''}>${isMega ? '<option>Mega instead</option>' : TYPES.map(t => `<option ${t === e.tera ? 'selected' : ''}>${t}</option>`).join('')}</select></div>

function rosterProblems(roster) {

  });
  const holders = {};
  roster.forEach(e => { if (e.item) (holders[e.item] ||= []).push(sp(e.id).name); });

// ---------- Match ----------
function toSet(e) {
  const sprd = SPREADS[e.spread];
  const evs = {hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0, ...sprd.evs};
  const isMega = megaStonesFor(e.id).includes(e.item);
  return {name: sp(e.id).name, species: sp(e.id).name, item: e.item, ability: e.ability, moves: e.moves.filter(Boolean),
    nature: sprd.nature, evs, ivs: {hp: 31, atk: 31, def: 31, spa: 31, spd: 31, spe: 31}, level: 50, gender: '',
    teraType: isMega ? sp(e.id).types[0] : e.tera};
}

function bringSelect(i) {
  const pl = S.players[i];
  const banned = S.bans[i];
  const avail = pl.roster.filter((_, k) => !banned.includes(k));
  const need = Math.min(BRING, avail.length);
  if (isCpu(i)) return Promise.resolve(shuffle(avail).slice(0, need));
  return new Promise(res => {
    let order = [];
    const draw = () => {
      $app.innerHTML = `<section class="stack"><div><p class="eyebrow">${esc(pl.name)} · Game ${S.game}</p><h2>Bring ${need} of ${avail.length}</h2><p class="muted">Tap in the order you want them. Your first pick leads.${banned.length ? ' Banned Pokémon sit out the rest of the match.' : ''}</p></div>
      <div class="bring">${pl.roster.map((e, k) => { const n = order.indexOf(k); const ban = banned.includes(k); return `<button class="card${ban ? ' banned' : ''}" data-k="${k}" aria-pressed="${n >= 0}" ${ban ? 'disabled' : ''}>${ban ? '<span class="ord ban">BANNED</span>' : n >= 0 ? `<span class="ord">${n === 0 ? 'LEAD' : n + 1}</span>` : ''}${spriteHtml(e.id)}<div class="name" style="font-size:14px">${esc(sp(e.id).name)}</div><div class="muted" style="font-size:12px">${esc(e.item)}</div></button>`; }).join('')}</div>
      <div class="row"><button class="btn" id="go" ${order.length !== need ? 'disabled' : ''}>Lock in ${order.length}/${need}</button><button class="btn ghost" id="clr">Clear</button></div></section>`;
      $app.querySelectorAll('.bring .card:not(:disabled)').forEach(c => c.onclick = () => {
        const k = +c.dataset.k, n = order.indexOf(k);
        if (n >= 0) order.splice(n, 1); else if (order.length < need) order.push(k);
        draw();
      });
      document.getElementById('clr').onclick = () => { order = []; draw(); };
      document.getElementById('go').onclick = () => res(order.map(k => pl.roster[k]));
    };
    draw();
  });
}

// Loser of a game bans one of the winner's Pokémon for the rest of the match
function banSelect(loser, winner) {
  const opp = S.players[winner];
  const options = opp.roster.map((e, k) => k).filter(k => !S.bans[winner].includes(k));
  if (isCpu(loser)) return Promise.resolve(rand(options));
  return new Promise(res => {
    $app.innerHTML = `<section class="stack"><div><p class="eyebrow">${esc(opp.name)} takes game ${S.game} · Score ${S.wins[0]} – ${S.wins[1]}</p><h2>${esc(S.players[loser].name)}, ban one of ${esc(opp.name)}'s Pokémon</h2><p class="muted">It sits out for the rest of the match.</p></div>
      <div class="bring">${options.map(k => { const e = opp.roster[k]; return `<button class="card" data-k="${k}">${spriteHtml(e.id)}<div class="name" style="font-size:14px">${esc(sp(e.id).name)}</div><div class="muted" style="font-size:12px">${esc(e.ability)}</div></button>`; }).join('')}</div></section>`;
    $app.querySelectorAll('.bring .card').forEach(c => c.onclick = () => res(+c.dataset.k));
  });
}

async function playMatch() {
  S.wins = [0, 0]; S.game = 0; S.bans = [[], []];
  while (S.wins[0] < 2 && S.wins[1] < 2) {
    S.game++;
    renderScore(`GAME ${S.game}`);
    const teams = [];
    if (S.mode === 'online') {
      const me = S.me, them = 1 - me;
      const mine = await bringSelect(me);
      netSend('bring', mine.map(e => S.players[me].roster.indexOf(e)));
      waitingScreen(`Waiting for ${S.players[them].name} to pick their ${BRING}…`);
      const theirs = (await netWait('bring')).map(k => S.players[them].roster[k]);
      teams.push(...(me === 0 ? [mine, theirs] : [theirs, mine]));
    } else for (const i of [0, 1]) {
      if (S.mode === 'friend') await curtain(`${S.players[i].name}, pick your ${BRING}`, `Game ${S.game} · hand the device over`, 'Choose team');
      teams.push(await bringSelect(i));
    }
    const winner = await playGame(teams);
    if (winner < 0) { await curtain('Tie game', `Both sides went down together. Game ${S.game} will be replayed.`, 'Replay game'); S.game--; continue; }
    S.wins[winner]++;
    renderScore(`GAME ${S.game}`);
    if (S.wins[0] < 2 && S.wins[1] < 2) {
      const loser = 1 - winner;
      let k;
      if (S.mode === 'online' && loser !== S.me) {
        waitingScreen(`You won game ${S.game}. ${S.players[loser].name} is choosing one of your Pokémon to ban…`);
        k = await netWait('ban');
      } else {
        k = await banSelect(loser, winner);
        if (S.mode === 'online') netSend('ban', k);
      }
      S.bans[winner].push(k);
      await curtain(`${sp(S.players[winner].roster[k].id).name} is banned`, `${S.players[loser].name} banned it from ${S.players[winner].name}'s team`, `Start game ${S.game + 1}`);
    }
  }
  const w = S.wins[0] > S.wins[1] ? 0 : 1;
  renderScore('FINAL');
  $app.innerHTML = `<section class="curtain"><p class="eyebrow">Best of 3 · Final</p><h2>${esc(S.players[w].name)} wins ${Math.max(...S.wins)}–${Math.min(...S.wins)}</h2>
    <div class="row" style="justify-content:center"><button class="btn" id="re">Rematch with same teams</button><button class="btn ghost" id="nd">New draft</button></div></section>`;
  let started = false;
  const rematch = () => { if (started) return; started = true; playMatch(); };
  document.getElementById('re').onclick = () => { if (S.mode === 'online') netSend('rematch', 1); rematch(); };
  if (S.mode === 'online') netWait('rematch').then(rematch);
  document.getElementById('nd').onclick = () => setup();
}

let B, logIdx, $log;
const sideIdx = sid => sid === 'p1' ? 0 : 1;

function fromTag(parts) {

function hpPct(s) { const [a, b] = s.split(' ')[0].split('/'); return b ? Math.round(100 * a / b) : 0; }

function describe(line) {
