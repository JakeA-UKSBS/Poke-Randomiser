  switch (cmd) {
    case 'turn': return {t: `Turn ${a}`, cls: 't'};
    case 'switch': case 'drag': return {t: `${S.players[sideIdx(a.slice(0, 2))].name} sent out ${b.split(',')[0]}.`};
    case 'move': return {t: `${monLabel(a)} used ${b}!`, cls: 'big'};
    case '-damage': return {t: `${monLabel(a)} → ${c === undefined && b.includes('fnt') ? 0 : hpPct(b)}% HP${fromTag(p)}`, cls: 'sub'};
    case '-heal': return {t: `${monLabel(a)} restored HP → ${hpPct(b)}%${fromTag(p)}`, cls: 'sub'};
    case 'faint': return {t: `${monLabel(a)} fainted!`, cls: 'big'};
    case '-supereffective': return {t: `It's super effective!`};
    case '-resisted': return {t: `It's not very effective…`, cls: 'sub'};
    case '-immune': return {t: `It doesn't affect ${monLabel(a)}${fromTag(p)}.`};
    case '-crit': return {t: `A critical hit!`};
    case '-miss': return {t: `${monLabel(a)}'s attack missed!`};
    case '-fail': return {t: `But it failed!`, cls: 'sub'};
    case '-status': return {t: `${monLabel(a)} ${STATUS[b] || b}${fromTag(p)}.`};
    case '-curestatus': return {t: `${monLabel(a)} is no longer affected by ${b}.`, cls: 'sub'};
    case '-boost': return {t: `${monLabel(a)}'s ${STAT[b] || b} rose${+c > 1 ? ` by ${c}` : ''}${fromTag(p)}.`, cls: 'sub'};
    case '-unboost': return {t: `${monLabel(a)}'s ${STAT[b] || b} fell${+c > 1 ? ` by ${c}` : ''}${fromTag(p)}.`, cls: 'sub'};
    case '-ability': return {t: `[${monLabel(a)}'s ${b}]`, cls: 'sub'};
    case '-item': return {t: `${monLabel(a)} has ${b}${fromTag(p)}.`, cls: 'sub'};
    case '-enditem': return {t: `${monLabel(a)}'s ${b} was used up.`, cls: 'sub'};
    case '-weather': return p.includes('[upkeep]') ? null : {t: b === 'none' || a === 'none' ? 'The weather cleared.' : `Weather: ${a.replace(/([a-z])([A-Z])/g, '$1 $2')}${fromTag(p)}.`};
    case '-fieldstart': return {t: `${a.replace('move: ', '')} took effect.`};
    case '-fieldend': return {t: `${a.replace('move: ', '')} wore off.`, cls: 'sub'};
    case '-sidestart': return {t: `${a.split(': ')[1]}'s side: ${b.replace('move: ', '')}.`};
    case '-sideend': return {t: `${a.split(': ')[1]}'s ${b.replace('move: ', '')} ended.`, cls: 'sub'};
    case '-start': return {t: `${monLabel(a)}: ${b.replace('move: ', '')}${c && !c.startsWith('[') ? ' ' + c : ''}${fromTag(p)}.`, cls: 'sub'};
    case '-end': return {t: `${monLabel(a)}: ${b.replace('move: ', '')} ended.`, cls: 'sub'};
    case '-activate': return {t: `${monLabel(a)}: ${b.replace(/^(move|ability|item): /, '')}!`, cls: 'sub'};
    case 'cant': return {t: `${monLabel(a)} can't move (${b.replace(/^(move|ability): /, '')}).`};
    case '-mega': return {t: `${monLabel(a)} Mega Evolved!`, cls: 'big'};
    case '-terastallize': return {t: `${monLabel(a)} Terastallized into the ${b} type!`, cls: 'big'};
    case '-transform': return {t: `${monLabel(a)} transformed!`};
    case '-message': return {t: a};
    case 'win': return {t: `${a} won the game!`, cls: 't'};
    default: return null;
  }
}

async function revealLog(viewer) {
  const lines = B.log.slice(logIdx); logIdx = B.log.length;
  const fx = {viewer, last: null, eff: null};
  for (let k = 0; k < lines.length; k++) {
    if (lines[k].startsWith('|split|')) { k++; continue; }
    const d = describe(lines[k]);
    let ms = 0;
    try { ms = animateLine(lines[k].split('|').slice(1), fx); } catch (e) { console.warn('animation skipped', e); }
    if (d) {
      const el = document.createElement('div'); el.textContent = d.t; if (d.cls) el.className = d.cls;
      $log.appendChild(el); $log.scrollTop = $log.scrollHeight;
      const tk = document.getElementById('ticker');
      if (tk && d.cls !== 't') tk.textContent = d.t;
    }
    if (d || ms) await sleep(Math.max(ms, !d ? 0 : d.cls === 'big' || d.cls === 't' ? 260 : 110));
  }
}

// ---------- Battle stage: snapshot, arena, animation, sound ----------
function takeSnap() {
  const o = {weather: B.field.weather, terrain: B.field.terrain, pseudo: Object.keys(B.field.pseudoWeather)};
  for (const sid of ['p1', 'p2']) {
    const s = B[sid], m = s.active[0];
    o[sid] = {name: s.name, conds: Object.keys(s.sideConditions), bench: s.pokemon.map(p => ({n: p.species.name, f: p.fainted})),
      mon: m ? {id: m.species.id, name: m.species.name, hp: m.hp, maxhp: m.maxhp, status: m.status, types: m.getTypes(), tera: m.terastallized || '', boosts: {...m.boosts}, ability: m.getAbility().name, fainted: m.fainted} : null};
  }
  return o;
}
const emptySnap = () => ({weather: '', terrain: '', pseudo: [], p1: {name: B.p1.name, conds: [], bench: [], mon: null}, p2: {name: B.p2.name, conds: [], bench: [], mon: null}});
const weatherKey = w => ({sunnyday: 'sun', desolateland: 'sun', raindance: 'rain', primordialsea: 'rain', sandstorm: 'sand', snow: 'snow', snowscape: 'snow', hail: 'snow'})[w] || '';
const hpClass = pct => pct <= 20 ? 'low' : pct <= 50 ? 'mid' : '';

function hudHtml(sid, s, mine) {
  const m = s.mon;
  const pct = m ? Math.max(0, Math.round(100 * m.hp / m.maxhp)) : 100;
  const boosts = m ? Object.entries(m.boosts).filter(([, v]) => v).map(([k, v]) => `<span class="chip">${STAT[k] || k} ${v > 0 ? '+' : ''}${v}</span>`).join('') : '';
  const bench = s.bench.map(p => `<i class="${p.f ? 'f' : ''}" title="${esc(p.n)}"></i>`).join('');
  return `<div class="hud${m ? '' : ' empty'}" id="hud-${sid}"><div class="l1"><span class="name" id="nm-${sid}">${esc(m?.name || '')}</span><span class="hpnum" id="hpt-${sid}">${m ? (mine ? `${m.hp}/${m.maxhp}` : pct + '%') : ''}</span></div>
    <div class="hp"><i id="hpb-${sid}" class="${hpClass(pct)}" style="width:${pct}%"></i></div>
    <div class="row" style="gap:5px" id="tags-${sid}">${m ? typeChips(m.types) : ''}${m?.status ? `<span class="status">${m.status}</span>` : ''}${m?.tera ? `<span class="chip" style="color:var(--gold)">Tera ${esc(m.tera)}</span>` : ''}${boosts}</div>
    <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:12px">${esc(s.name)}${m ? ' · ' + esc(m.ability) : ''}</span><span class="bench">${bench}</span></div></div>`;
}
function stageHtml(viewer, snap = takeSnap()) {
  const foeSid = viewer === 'p1' ? 'p2' : 'p1';
  const chips = [];
  if (snap.weather) chips.push(Dex.conditions.get(snap.weather).name);
  if (snap.terrain) chips.push(Dex.conditions.get(snap.terrain).name);
  for (const k of snap.pseudo) chips.push(Dex.conditions.get(k).name);
  for (const [who, sid] of [['Foe', foeSid], ['You', viewer]]) for (const k of snap[sid].conds) chips.push(`${who}: ${Dex.conditions.get(k).name}`);
  const spr = sid => { const m = snap[sid].mon; return `<div class="plat"><div class="spr${m?.fainted ? ' gone' : ''}" id="spr-${sid}">${m ? spriteHtml(m.id) : ''}</div></div>`; };
  return `<div class="stage arena" id="arena" data-weather="${weatherKey(snap.weather)}">
    <div class="wx" aria-hidden="true"></div>
    <div class="fieldbar"><span class="row" style="gap:6px;flex:1">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</span><button class="mute" id="mute" aria-pressed="${SFX.muted}" title="Sound">${SFX.muted ? 'Sound off' : 'Sound on'}</button></div>
    <div class="mon foe">${hudHtml(foeSid, snap[foeSid], false)}${spr(foeSid)}</div>
    <div class="mon me">${spr(viewer)}${hudHtml(viewer, snap[viewer], true)}</div>
    <div class="ticker" id="ticker" aria-hidden="true"></div>
  </div>`;
}

// Replays one protocol line on the stage; returns how long to hold before the next line
function animateLine(p, fx) {
  const [cmd, a, b, c] = p;
  const $ = id => document.getElementById(id);
  const sidOf = ident => ident?.slice(0, 2);
  const pulse = (node, cls, ms) => { if (!node) return; node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); setTimeout(() => node.classList.remove(cls), ms); };
  const setHp = (sid, hp) => {
    const [x, y] = hp.split(' ')[0].split('/').map(Number);
    const pct = y ? Math.max(0, Math.round(100 * x / y)) : 0;
    const bar = $('hpb-' + sid); if (bar) { bar.style.width = pct + '%'; bar.className = hpClass(pct); }
    const t = $('hpt-' + sid); if (t) t.textContent = sid === fx.viewer && y && y !== 100 ? `${x}/${y}` : pct + '%';
  };
  const center = sid => {
    const ar = $('arena')?.getBoundingClientRect(), r = $('spr-' + sid)?.getBoundingClientRect();
    return ar && r ? {x: r.left - ar.left + r.width / 2, y: r.top - ar.top + r.height / 2} : null;
  };
  const spawn = (cls, color, at, extra = '') => {
    const ar = $('arena'); if (!ar || !at) return null;
    const d = document.createElement('div'); d.className = cls; d.style.cssText = `left:${at.x}px;top:${at.y}px;--c:${color};${extra}`;
    ar.appendChild(d); setTimeout(() => d.remove(), 900); return d;
  };
  switch (cmd) {
    case 'switch': case 'drag': case 'replace': {
      const sid = sidOf(a), s = sp(b.split(',')[0]);
      const box = $('spr-' + sid); if (!box) return 0;
      box.classList.remove('gone', 'faint'); box.innerHTML = spriteHtml(s.id);
      $('hud-' + sid)?.classList.remove('empty');
      if ($('nm-' + sid)) $('nm-' + sid).textContent = s.name;
      if ($('tags-' + sid)) $('tags-' + sid).innerHTML = typeChips(s.types);
      setHp(sid, c); pulse(box, 'enter', 500); sfx('switch'); return 480;
    }
    case 'detailschange': {
      const sid = sidOf(a), s = sp(b.split(',')[0]);
      if ($('spr-' + sid)) $('spr-' + sid).innerHTML = spriteHtml(s.id);
      if ($('nm-' + sid)) $('nm-' + sid).textContent = s.name;
      if ($('tags-' + sid)) $('tags-' + sid).innerHTML = typeChips(s.types);
      return 0;
    }
    case 'move': {
      const src = sidOf(a), mv = Dex.moves.get(b), tgt = sidOf(c) || src;
      const color = TYPE_COLORS[mv.type] || '#fff';
      fx.last = {color, tgt}; fx.eff = null;
      if (p.includes('[still]')) return 150;
      pulse($('spr-' + src), 'lunge', 400);
      if (mv.category === 'Status' || tgt === src) { spawn('aura', color, center(src)); sfx('status'); return 450; }
      if (mv.category === 'Special') {
        const from = center(src), to = center(tgt), orb = spawn('orb', color, from);
        if (orb && from && to && orb.animate) orb.animate([{transform: 'translate(-50%,-50%) scale(.6)'}, {transform: `translate(calc(-50% + ${to.x - from.x}px), calc(-50% + ${to.y - from.y}px)) scale(1.2)`}], {duration: 340, easing: 'ease-in', fill: 'forwards'});
        sfx('special'); return 380;
      }
      sfx('physical'); return 300;
    }
    case '-supereffective': fx.eff = 'se'; return 0;
    case '-resisted': fx.eff = 'nve'; return 0;
    case '-crit': pulse($('arena'), 'critflash', 300); sfx('crit'); return 150;
    case '-damage': {
      const sid = sidOf(a); setHp(sid, b);
      if (p.some(x => x.startsWith('[from]'))) { pulse($('spr-' + sid), 'hurt', 320); sfx('chip'); return 320; }
      pulse($('spr-' + sid), 'hit', 420);
      spawn('burst', fx.last?.color || '#fff', center(sid));
      sfx(fx.eff === 'se' ? 'hitSE' : fx.eff === 'nve' ? 'hitNVE' : 'hit'); fx.eff = null;
      return 440;
    }
    case '-heal': { const sid = sidOf(a); setHp(sid, b); pulse($('spr-' + sid), 'heal', 600); sfx('heal'); return 450; }
    case 'faint': { const box = $('spr-' + sidOf(a)); box?.classList.add('faint'); sfx('faint'); return 700; }
    case '-boost': pulse($('spr-' + sidOf(a)), 'up', 700); sfx('up'); return 450;
    case '-unboost': pulse($('spr-' + sidOf(a)), 'down', 700); sfx('down'); return 450;
    case '-status': {
      const sid = sidOf(a), tags = $('tags-' + sid);
      if (tags && !tags.querySelector('.status')) tags.insertAdjacentHTML('beforeend', `<span class="status">${esc(b)}</span>`);
      pulse($('spr-' + sid), 'afflict', 600); sfx('statusHit'); return 450;
    }
    case '-curestatus': $('tags-' + sidOf(a))?.querySelector('.status')?.remove(); return 0;
    case '-mega': pulse($('spr-' + sidOf(a)), 'mega', 1000); sfx('mega'); return 1000;
    case '-terastallize': {
      const box = $('spr-' + sidOf(a)); if (box) box.style.setProperty('--tc', TYPE_COLORS[b] || '#fff');
      $('tags-' + sidOf(a))?.insertAdjacentHTML('beforeend', `<span class="chip" style="color:var(--gold)">Tera ${esc(b)}</span>`);
      pulse(box, 'tera', 1000); sfx('tera'); return 1000;
    }
    case '-weather': { if (!p.includes('[upkeep]') && $('arena')) $('arena').dataset.weather = weatherKey(toID(a)); return 0; }
    default: return 0;
  }
}

// Original synthesized sound effects (Web Audio); no game audio is used
const SFX = {ctx: null, muted: (() => { try { return localStorage.getItem('starter-draft-mute') === '1'; } catch { return false; } })()};
function sfx(name) {
  if (SFX.muted) return;
  try {
    SFX.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
    const ctx = SFX.ctx; if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime;
    const tone = (f1, f2, dur, type = 'sine', vol = .15, delay = 0) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + delay;
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + .02);
    };
    const noise = (dur, vol = .2, freq = 1200, delay = 0) => {
      const len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), t = t0 + delay;
      f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
      src.buffer = buf; src.connect(f).connect(g).connect(ctx.destination); src.start(t);
    };
    ({
      switch: () => { tone(320, 760, .12, 'square', .06); tone(760, 1100, .1, 'square', .05, .1); },
      physical: () => noise(.09, .12, 2500),
      special: () => tone(380, 1100, .3, 'sine', .12),
      status: () => { tone(620, 900, .12, 'triangle', .1); tone(900, 1240, .12, 'triangle', .08, .11); },
      hit: () => { noise(.14, .3, 1400); tone(170, 60, .14, 'square', .12); },
      hitSE: () => { noise(.22, .4, 2200); tone(260, 55, .22, 'square', .16); tone(130, 40, .2, 'sawtooth', .1, .06); },
      hitNVE: () => { noise(.08, .16, 700); tone(120, 70, .08, 'square', .06); },
      chip: () => noise(.07, .12, 900),
      crit: () => tone(1500, 2400, .08, 'square', .06),
      heal: () => [660, 830, 990].forEach((f, i) => tone(f, f * 1.01, .18, 'sine', .08, i * .09)),
      faint: () => tone(520, 70, .7, 'sawtooth', .1),
      up: () => [440, 560, 700].forEach((f, i) => tone(f, f * 1.05, .1, 'triangle', .08, i * .07)),
      down: () => [700, 560, 440].forEach((f, i) => tone(f, f * .95, .1, 'triangle', .08, i * .07)),
      statusHit: () => { tone(300, 240, .25, 'sawtooth', .07); tone(310, 250, .25, 'sawtooth', .05, .02); },
      mega: () => { tone(160, 1300, .8, 'sawtooth', .07); [1000, 1330, 1600].forEach((f, i) => tone(f, f, .25, 'sine', .07, .55 + i * .07)); },
      tera: () => [1200, 1600, 2000, 2400, 1800].forEach((f, i) => tone(f, f * 1.02, .16, 'triangle', .06, i * .08)),
    })[name]?.();
  } catch {}
}
document.addEventListener('click', e => {
  if (e.target.id !== 'mute') return;
  SFX.muted = !SFX.muted;
  try { localStorage.setItem('starter-draft-mute', SFX.muted ? '1' : '0'); } catch {}
  e.target.setAttribute('aria-pressed', SFX.muted); e.target.textContent = SFX.muted ? 'Sound off' : 'Sound on';
});

function battleShell(viewer, controls, snap) {
  const keep = $log;
  $app.innerHTML = `<section class="battle"><div class="stack"><div id="stage">${stageHtml(viewer, snap)}</div><div class="controls" id="controls">${controls}</div></div><div class="log" id="log" aria-live="polite"></div></section>`;
  const fresh = document.getElementById('log');
  // Re-attaching the kept log resets its scroll, so jump back to the latest line
  if (keep) { fresh.replaceWith(keep); keep.scrollTop = keep.scrollHeight; } else { $log = fresh; }
}

function controlsHtml(sid) {
  const req = B[sid].activeRequest;
  const act = req.active?.[0];
  let html = `<div class="row" style="justify-content:space-between"><h3>${esc(S.players[sideIdx(sid)].name)}: ${req.forceSwitch ? 'choose a replacement' : 'what will you do?'}</h3></div>`;
  if (!req.forceSwitch && act) {
    html += `<div class="row">${act.canMegaEvo ? `<button class="toggle" id="t-mega" aria-pressed="false">Mega Evolve</button>` : ''}${act.canTerastallize ? `<button class="toggle" id="t-tera" aria-pressed="false">Terastallize (${esc(act.canTerastallize)})</button>` : ''}</div>`;
    const foe = B[sid === 'p1' ? 'p2' : 'p1'].active[0];
    const foeTypes = foe && !foe.fainted ? foe.getTypes() : null;
    // Type-chart hint only: abilities like Levitate or Flash Fire aren't accounted for
    const effNote = mv => {
      if (!foeTypes || mv.category === 'Status') return '';
      if (!Dex.getImmunity(mv.type, foeTypes)) return '<em class="eff none">No effect</em>';
      const e = Dex.getEffectiveness(mv.type, foeTypes);
      return e > 0 ? `<em class="eff se">Super effective${e > 1 ? ' ×4' : ''}</em>` : e < 0 ? `<em class="eff nve">Not very effective${e < -1 ? ' ×¼' : ''}</em>` : '';
    };
    html += `<div class="moves">${act.moves.map((m, k) => { const mv = Dex.moves.get(m.id); const col = TYPE_COLORS[mv.type] || '#555';
      const acc = mv.accuracy === true ? 'Never misses' : `${mv.accuracy}% acc`;
      return `<button class="move" data-move="${k + 1}" style="background:${col}" ${m.disabled ? 'disabled' : ''}><b>${esc(m.move)}</b><span>${esc(mv.type)} · ${mv.category === 'Status' ? 'Status' : (mv.basePower || '—') + ' BP'} · ${acc}${m.maxpp ? ` · ${m.pp}/${m.maxpp} PP` : ''}</span>${effNote(mv)}</button>`; }).join('')}</div>`;
  }
  const trapped = !req.forceSwitch && act?.trapped;
  html += `<div class="eyebrow">${trapped ? 'Trapped — cannot switch' : 'Switch'}</div><div class="switches">${req.side.pokemon.map((p, k) => {
    const fnt = p.condition.endsWith('fnt'); const s = sp(p.details.split(',')[0]);
    return `<button class="sw" data-sw="${k + 1}" ${p.active || fnt || trapped ? 'disabled' : ''}>${spriteHtml(s.id)}<span>${esc(s.name)}<br><span class="hpnum">${fnt ? 'fainted' : hpPct(p.condition) + '%'}</span></span></button>`; }).join('')}</div><div class="err" id="err"></div>`;
  return html;
}

function humanChoice(sid) {
  return new Promise(res => {
    battleShell(sid, controlsHtml(sid));
    let mega = false, tera = false;
    const tm = document.getElementById('t-mega'), tt = document.getElementById('t-tera');
    if (tm) tm.onclick = () => { mega = !mega; tm.setAttribute('aria-pressed', mega); };
    if (tt) tt.onclick = () => { tera = !tera; tt.setAttribute('aria-pressed', tera); };
    const submit = str => { if (B.choose(sid, str)) res(str); else document.getElementById('err').textContent = "That choice isn't allowed right now."; };
    $app.querySelectorAll('[data-move]').forEach(b => b.onclick = () => submit(`move ${b.dataset.move}${mega ? ' mega' : ''}${tera ? ' terastallize' : ''}`));
    $app.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => submit(`switch ${b.dataset.sw}`));
  });
}

function cpuChoice(sid) {
  const req = B[sid].activeRequest;
  const foe = B[sid === 'p1' ? 'p2' : 'p1'].active[0];
  const alive = req.side.pokemon.map((p, k) => ({p, k: k + 1})).filter(x => !x.p.active && !x.p.condition.endsWith('fnt'));
  if (req.forceSwitch) { B.choose(sid, alive.length ? `switch ${rand(alive).k}` : 'pass'); return; }
  const act = req.active[0];
  const me = B[sid].active[0];
  let best = null, bestScore = -1;
  act.moves.forEach((m, k) => {
    if (m.disabled) return;
    const mv = Dex.moves.get(m.id);
    let score;
    if (mv.category === 'Status' || !foe) score = 25 + Math.random() * 30;
    else {
      const types = foe.getTypes();
      const immune = !Dex.getImmunity(mv.type, types);
      const eff = Math.pow(2, Dex.getEffectiveness(mv.type, types));
      const stab = me.getTypes().includes(mv.type) ? 1.5 : 1;
      score = immune ? 0 : (mv.basePower || 60) * eff * stab * (0.85 + Math.random() * 0.3);
    }
    if (score > bestScore) { bestScore = score; best = k + 1; }
  });
  let str = `move ${best || 1}`;
  if (act.canMegaEvo) str += ' mega';
  else if (act.canTerastallize && Math.random() < 0.5) str += ' terastallize';
  if (!B.choose(sid, str)) B.choose(sid, 'default');
}

async function playGame(teams) {
  // Online games share a seed so both browsers compute identical battles
  B = new Battle(S.mode === 'online' ? {formatid: 'gen9customgame', seed: `${S.seed},${S.battles++}`} : {formatid: 'gen9customgame'});
  B.setPlayer('p1', {name: S.players[0].name, team: Teams.pack(teams[0].map(toSet))});
  B.setPlayer('p2', {name: S.players[1].name, team: Teams.pack(teams[1].map(toSet))});
  if (B.p1.activeRequest?.teamPreview) { B.choose('p1', 'default'); B.choose('p2', 'default'); }
  logIdx = 0; $log = null;
  const firstViewer = S.mode === 'online' ? (S.me === 0 ? 'p1' : 'p2') : 'p1';
  battleShell(firstViewer, '', emptySnap());
  const head = document.createElement('div'); head.className = 't'; head.textContent = `Game ${S.game}`; $log.appendChild(head);
  await revealLog(firstViewer);
  let lastViewer = null;
  while (!B.ended) {
    const need = ['p1', 'p2'].filter(sid => { const r = B[sid].activeRequest; return r && !r.wait && !B[sid].isChoiceDone(); });
    if (!need.length) break;
    const preTurn = takeSnap(); // the stage replays the turn starting from here
    const mySid = S.me === 0 ? 'p1' : 'p2';
    if (S.mode === 'online') need.sort(a => a === mySid ? -1 : 1);
    for (const sid of need) {
      if (isCpu(sideIdx(sid))) { cpuChoice(sid); continue; }
      if (S.mode === 'online') {
        if (sid === mySid) netSend('choice', await humanChoice(sid));
        else {
          battleShell(mySid, `<p class="muted">Waiting for ${esc(S.players[sideIdx(sid)].name)} to choose…</p>`, preTurn);
          const str = await netWait('choice');
          if (!B.choose(sid, str)) console.error('Opponent choice rejected', str);
        }
        continue;
      }
      if (S.mode === 'friend' && need.length > 1 && lastViewer !== sid) {
        await curtain(`${S.players[sideIdx(sid)].name}'s move`, `Turn ${B.turn} · hand the device over`, 'Show my options');
      } else if (S.mode === 'friend' && lastViewer && lastViewer !== sid) {
        await curtain(`${S.players[sideIdx(sid)].name}'s move`, `Hand the device over`, 'Show my options');
      }
      lastViewer = sid;
      await humanChoice(sid);
    }
    const viewer = S.mode === 'cpu' ? 'p1' : S.mode === 'online' ? mySid : (lastViewer || 'p1');
    battleShell(viewer, `<p class="muted">Resolving turn…</p>`, preTurn);
    await revealLog(viewer);
    await sleep(250);
    document.getElementById('stage').innerHTML = stageHtml(viewer);
    if (S.mode === 'friend') lastViewer = null;
  }
  await sleep(700);
  if (!B.winner) return -1;
  return B.winner === S.players[0].name ? 0 : 1;
}

setup();
</script>
